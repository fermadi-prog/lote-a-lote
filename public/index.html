<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lote a Lote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F6F5F0; --paper-grid:#E7E3D6; --surface:#FFFFFF; --ink:#1E2A24;
    --ink-soft:#57635B; --ink-faint:#8B9188; --line:#DCD7C7; --line-strong:#C7C1AC;
    --accent:#C05B2C; --accent-strong:#A94B21; --accent-soft:#F3DFCF; --accent-ink:#FFF8F2;
    --moss:#4C6B4A; --moss-soft:#E4ECE1; --good:#3F7D4F; --good-soft:#E1EEE3;
    --warn:#96691E; --warn-soft:#F3E7D2; --bad:#AA3B2C; --bad-soft:#F5E1DC;
    --shadow: 0 1px 2px rgba(30,42,36,0.06), 0 8px 24px -12px rgba(30,42,36,0.18);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121E19; --paper-grid:#1B2A22; --surface:#182620; --ink:#ECE9DE;
      --ink-soft:#A9B1A6; --ink-faint:#75806F; --line:#293B31; --line-strong:#354A3D;
      --accent:#E38653; --accent-strong:#EF9765; --accent-soft:#3A2A1F; --accent-ink:#FFF3EA;
      --moss:#8FB37D; --moss-soft:#213222; --good:#79C48A; --good-soft:#1D3122;
      --warn:#E0B45C; --warn-soft:#33291a; --bad:#E38672; --bad-soft:#37241f;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#121E19; --paper-grid:#1B2A22; --surface:#182620; --ink:#ECE9DE;
    --ink-soft:#A9B1A6; --ink-faint:#75806F; --line:#293B31; --line-strong:#354A3D;
    --accent:#E38653; --accent-strong:#EF9765; --accent-soft:#3A2A1F; --accent-ink:#FFF3EA;
    --moss:#8FB37D; --moss-soft:#213222; --good:#79C48A; --good-soft:#1D3122;
    --warn:#E0B45C; --warn-soft:#33291a; --bad:#E38672; --bad-soft:#37241f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper-grid) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px) 0 0/28px 100%,
      var(--paper);
    color:var(--ink); font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:15.5px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1,h2,h3,h4{font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; text-wrap:balance; margin:0; color:var(--ink);}
  .num{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  p{margin:0;} a{color:inherit;} button{font:inherit;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  .shell{max-width:1040px; margin:0 auto; padding:0 20px 80px;}

  header.topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1040px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none;}
  .brand-text h1{font-size:1.28rem; font-weight:700; letter-spacing:-0.01em;}
  .brand-text span{display:block; font-size:0.72rem; color:var(--ink-soft); letter-spacing:0.03em;}

  .topbar-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  nav.tabs{display:flex; gap:4px;}
  nav.tabs button{background:none; border:none; cursor:pointer; padding:8px 14px; border-radius:999px; color:var(--ink-soft); font-weight:500; font-size:0.92rem; transition:background 0.15s, color 0.15s;}
  nav.tabs button:hover{background:var(--surface); color:var(--ink);}
  nav.tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper);}
  .user-box{display:flex; align-items:center; gap:8px; font-size:0.86rem; color:var(--ink-soft);}
  .user-box strong{color:var(--ink);}
  @media (max-width:760px){
    .topbar-inner{flex-direction:column; align-items:stretch;}
    nav.tabs{justify-content:space-between;}
    nav.tabs button{flex:1; text-align:center; padding:8px 8px;}
    .topbar-right{justify-content:space-between;}
  }

  .banner{display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin:18px 0; font-size:0.88rem; color:var(--ink-soft);}
  .banner[hidden]{display:none;}
  .banner strong{color:var(--ink);}
  .banner button{margin-left:auto; background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:2px 4px; flex:none;}
  .banner button:hover{color:var(--ink);}
  .banner.err{background:var(--bad-soft); color:var(--bad);} .banner.err strong{color:var(--bad);}

  section.view{margin-top:22px;} section.view[hidden]{display:none;}

  .controls{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  label{font-size:0.78rem; font-weight:500; color:var(--ink-soft); letter-spacing:0.01em;}
  input[type="text"], input[type="number"], input[type="tel"], input[type="search"], input[type="email"], input[type="password"], select, textarea{
    font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; padding:9px 11px; width:100%;
  }
  input::placeholder, textarea::placeholder{color:var(--ink-faint);}
  textarea{resize:vertical; min-height:88px; font-family:inherit;}
  .controls .field.grow{flex:1 1 220px;} .controls .field{flex:0 0 auto; min-width:150px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; border:1px solid transparent; cursor:pointer; padding:9px 16px; font-weight:600; font-size:0.9rem; transition:background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);} .btn-primary:hover{background:var(--accent-strong);}
  .btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink);} .btn-ghost:hover{background:var(--surface);}
  .btn-soft{background:var(--moss-soft); color:var(--moss); border-color:transparent;} .btn-soft:hover{filter:brightness(0.96);}
  .btn-danger{background:transparent; border-color:var(--line-strong); color:var(--bad);} .btn-danger:hover{background:var(--bad-soft); border-color:transparent;}
  .btn-sm{padding:6px 12px; font-size:0.82rem; border-radius:8px;}
  .btn[disabled]{opacity:0.5; cursor:not-allowed;} .btn svg{flex:none;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; cursor:pointer; text-align:left; padding:0; color:inherit; width:100%; transition:transform 0.15s, box-shadow 0.15s;}
  .card:hover{transform:translateY(-2px);}
  .card-media{position:relative; aspect-ratio:4/3; background:repeating-linear-gradient(45deg, var(--paper-grid) 0 1px, transparent 1px 14px), var(--paper); display:flex; align-items:center; justify-content:center; color:var(--ink-faint);}
  .card-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .zone-pill{position:absolute; top:10px; left:10px; background:color-mix(in srgb, var(--ink) 78%, transparent); color:var(--paper); font-size:0.72rem; font-weight:600; padding:4px 10px; border-radius:999px; display:flex; align-items:center; gap:4px; max-width:calc(100% - 20px);}
  .zone-pill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .status-pill{position:absolute; top:10px; right:10px; font-size:0.7rem; font-weight:700; padding:4px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:0.04em;}
  .status-pill.vendido{background:var(--good-soft); color:var(--good);}
  .card-body{padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .card-body h3{font-size:1.02rem; line-height:1.3;}
  .card-price{font-size:1.28rem; font-weight:600; color:var(--ink);}
  .card-desc{color:var(--ink-soft); font-size:0.86rem; line-height:1.45; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:4px; gap:8px;}
  .owner-tag{font-size:0.76rem; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .empty{text-align:center; padding:48px 20px; color:var(--ink-soft); border:1px dashed var(--line-strong); border-radius:var(--radius); background:var(--surface);}
  .empty h3{margin-bottom:6px; color:var(--ink);}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;} .form-grid .full{grid-column:1/-1;}
  .price-row{display:grid; grid-template-columns:2fr 1fr; gap:8px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;}}

  .photo-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px;}
  .photo-chip{position:relative; width:74px; height:74px; border-radius:10px; overflow:hidden; border:1px solid var(--line-strong);}
  .photo-chip img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-chip button{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; font-size:11px; line-height:1;}
  .photo-add{width:74px; height:74px; border-radius:10px; border:1.5px dashed var(--line-strong); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); cursor:pointer; background:transparent; flex-direction:column; gap:2px; font-size:0.65rem;}
  .photo-add:hover{border-color:var(--accent); color:var(--accent);}
  .hint{font-size:0.78rem; color:var(--ink-faint); margin-top:4px;}
  .form-msg{font-size:0.85rem; margin-top:10px; padding:9px 12px; border-radius:8px;}
  .form-msg.ok{background:var(--good-soft); color:var(--good);} .form-msg.err{background:var(--bad-soft); color:var(--bad);}

  .my-listings{margin-top:32px;} .my-listings h2{font-size:1.05rem; margin-bottom:12px;}
  .mini-row{display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:10px; flex-wrap:wrap;}
  .mini-thumb{width:52px; height:52px; border-radius:8px; background:var(--paper-grid); flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); overflow:hidden;}
  .mini-thumb img{width:100%; height:100%; object-fit:cover;}
  .mini-info{flex:1; min-width:0;} .mini-info h4{font-size:0.92rem; margin-bottom:2px;}
  .mini-meta{font-size:0.78rem; color:var(--ink-soft); display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .mini-actions{display:flex; gap:6px; flex:none; flex-wrap:wrap;}
  .badge{font-size:0.7rem; font-weight:700; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em;}
  .badge.pendiente{background:var(--warn-soft); color:var(--warn);}
  .badge.contraoferta{background:var(--accent-soft); color:var(--accent-strong);}
  .badge.aceptada{background:var(--good-soft); color:var(--good);}
  .badge.rechazada, .badge.retirada{background:var(--bad-soft); color:var(--bad);}
  .badge.vendido{background:var(--good-soft); color:var(--good);} .badge.activo{background:var(--moss-soft); color:var(--moss);}
  .badge.admin{background:var(--accent); color:var(--accent-ink);}

  .offer-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .offer-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .offer-head h4{font-size:0.98rem;}
  .dir-tag{font-size:0.7rem; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em;}
  .dir-tag.enviaste{background:var(--accent-soft); color:var(--accent-strong);} .dir-tag.recibiste{background:var(--moss-soft); color:var(--moss);}
  .thread{display:flex; flex-direction:column; gap:8px; margin:10px 0;}
  .bubble{max-width:78%; padding:9px 12px; border-radius:12px; font-size:0.86rem; line-height:1.4;}
  .bubble .amt{font-weight:700; font-size:0.95rem;} .bubble .msg{margin-top:2px; color:inherit; opacity:0.9;}
  .bubble .ts{display:block; font-size:0.68rem; opacity:0.65; margin-top:3px;}
  .bubble.comprador{align-self:flex-end; background:var(--accent-soft); color:var(--accent-strong); border-bottom-right-radius:3px;}
  .bubble.vendedor{align-self:flex-start; background:var(--moss-soft); color:var(--moss); border-bottom-left-radius:3px;}
  .offer-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;}
  .counter-form{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .counter-form .field{min-width:120px;}
  .status-line{font-size:0.84rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px; flex-wrap:wrap;}

  .overlay-bg{position:fixed; inset:0; background:color-mix(in srgb, var(--ink) 45%, transparent); display:flex; align-items:flex-start; justify-content:center; padding:32px 16px; overflow-y:auto; z-index:50;}
  .overlay-bg[hidden]{display:none;}
  .dialog{background:var(--paper); border:1px solid var(--line); border-radius:18px; max-width:640px; width:100%; box-shadow:var(--shadow); overflow:hidden; margin:auto 0;}
  .dialog.narrow{max-width:420px;}
  .dialog-head{position:relative;}
  .dialog-media{aspect-ratio:16/9; background:repeating-linear-gradient(45deg, var(--paper-grid) 0 1px, transparent 1px 14px), var(--paper); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); position:relative;}
  .dialog-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .dialog-close{position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; background:color-mix(in srgb, var(--ink) 65%, transparent); color:var(--paper); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2;}
  .carousel-nav{position:absolute; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; background:color-mix(in srgb, var(--ink) 55%, transparent); color:var(--paper); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .carousel-nav.prev{left:10px;} .carousel-nav.next{right:10px;}
  .carousel-dots{position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:5px;}
  .carousel-dots span{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.55);} .carousel-dots span.on{background:#fff;}
  .dialog-body{padding:20px 22px 24px; display:flex; flex-direction:column; gap:14px;}
  .dialog-top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
  .dialog-top h2{font-size:1.35rem;}
  .dialog-zone{display:flex; align-items:center; gap:5px; color:var(--ink-soft); font-size:0.86rem; margin-top:4px;}
  .dialog-price{font-size:1.55rem; font-weight:700; white-space:nowrap;}
  .dialog-desc{color:var(--ink-soft); line-height:1.6; white-space:pre-wrap;}
  .contact-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .contact-row .phone{font-family:"IBM Plex Mono", monospace; font-weight:600;}
  .divider{height:1px; background:var(--line); border:none; margin:2px 0;}
  .offer-form{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;} .offer-form .field{flex:1 1 140px;}
  .own-note{display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:0.86rem; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; flex-wrap:wrap;}

  .auth-tabs{display:flex; gap:6px; margin-bottom:16px; background:var(--paper); border-radius:10px; padding:4px;}
  .auth-tabs button{flex:1; padding:8px; border:none; border-radius:8px; background:none; cursor:pointer; color:var(--ink-soft); font-weight:600; font-size:0.88rem;}
  .auth-tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  .auth-form{display:flex; flex-direction:column; gap:12px;}

  table.admin-table{width:100%; border-collapse:collapse; font-size:0.86rem;}
  table.admin-table th{text-align:left; color:var(--ink-soft); font-weight:600; font-size:0.76rem; text-transform:uppercase; letter-spacing:0.03em; padding:8px 10px; border-bottom:1px solid var(--line);}
  table.admin-table td{padding:9px 10px; border-bottom:1px solid var(--line);}
  .admin-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
  .stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px;}
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-width:120px;}
  .stat-tile .n{font-size:1.5rem; font-weight:700; font-family:"IBM Plex Mono", monospace;}
  .stat-tile .l{font-size:0.76rem; color:var(--ink-soft);}

  .hero{margin-top:18px; border-radius:18px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow); line-height:0;}
  .hero svg{display:block; width:100%; height:auto;}

  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:999px; font-size:0.86rem; font-weight:500; box-shadow:var(--shadow); z-index:80; display:flex; align-items:center; gap:8px; max-width:90vw;}
  .toast[hidden]{display:none;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 3 7v3c0 6.5 4 10.5 9 12 5-1.5 9-5.5 9-12V7l-9-5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div class="brand-text">
        <h1>Lote a Lote</h1>
        <span>Comprá y vendé terrenos a cuotas</span>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button role="tab" data-tab="explorar" aria-selected="true">Explorar</button>
      <button role="tab" data-tab="publicar" aria-selected="false">Publicar</button>
      <button role="tab" data-tab="ofertas" aria-selected="false">Mis ofertas</button>
      <button role="tab" data-tab="admin" aria-selected="false" id="adminTabBtn" hidden>Admin</button>
    </nav>
    <div class="topbar-right" id="userBox"></div>
  </div>
</header>

<div class="shell">
  <div class="banner" id="banner" hidden></div>

  <!-- ================= EXPLORAR ================= -->
  <section class="view" id="view-explorar">
    <div class="hero" aria-hidden="true">
      <svg viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice" role="presentation">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style="stop-color:var(--paper)"/>
            <stop offset="100%" style="stop-color:var(--accent-soft)"/>
          </linearGradient>
          <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:var(--accent-strong)"/>
            <stop offset="100%" style="stop-color:var(--accent)"/>
          </radialGradient>
        </defs>
        <rect x="0" y="0" width="1200" height="220" fill="url(#skyGrad)"/>
        <circle cx="960" cy="112" r="58" fill="url(#sunGrad)" opacity="0.9"/>
        <path d="M0,150 C120,110 220,170 360,140 C480,116 560,150 680,132 C820,112 900,150 1040,128 C1120,116 1160,130 1200,120 L1200,220 L0,220 Z" style="fill:var(--moss-soft)"/>
        <path d="M0,175 C140,150 260,190 420,165 C540,146 640,178 780,158 C900,140 1000,172 1200,150 L1200,220 L0,220 Z" style="fill:var(--moss)" opacity="0.55"/>
        <path d="M0,200 C160,182 320,206 480,190 C640,174 760,204 920,188 C1040,176 1120,196 1200,188 L1200,220 L0,220 Z" style="fill:var(--ink)" opacity="0.28"/>
        <g style="stroke:var(--paper); stroke-opacity:0.55; stroke-width:2; stroke-dasharray:2 10; stroke-linecap:round;"><line x1="60" y1="196" x2="1140" y2="150"/></g>
        <g style="fill:var(--accent-ink); opacity:0.9;"><circle cx="230" cy="182" r="4"/><circle cx="560" cy="165" r="4"/><circle cx="890" cy="172" r="4"/></g>
      </svg>
    </div>
    <div class="controls">
      <div class="field grow"><label for="searchInput">Buscar</label><input type="search" id="searchInput" placeholder="Título, zona o descripción"></div>
      <div class="field"><label for="countryFilter">País</label><select id="countryFilter"><option value="">Todos</option></select></div>
      <div class="field"><label for="zoneFilter">Zona</label><select id="zoneFilter"><option value="">Todas</option></select></div>
      <div class="field"><label for="sortSelect">Ordenar</label>
        <select id="sortSelect">
          <option value="recientes">Más recientes</option>
          <option value="menor">Precio: menor a mayor</option>
          <option value="mayor">Precio: mayor a menor</option>
        </select>
      </div>
    </div>
    <div class="grid" id="listingGrid"></div>
    <div class="empty" id="emptyExplorar" hidden><h3>Todavía no hay lotes publicados</h3><p>Sé el primero: andá a la pestaña Publicar y sumá tu terreno.</p></div>
  </section>

  <!-- ================= PUBLICAR ================= -->
  <section class="view" id="view-publicar" hidden>
    <div id="publicarGate"></div>
  </section>

  <!-- ================= MIS OFERTAS ================= -->
  <section class="view" id="view-ofertas" hidden>
    <div id="ofertasGate"></div>
  </section>

  <!-- ================= ADMIN ================= -->
  <section class="view" id="view-admin" hidden>
    <h2 style="font-size:1.1rem; margin-bottom:14px;">Panel de administración</h2>
    <div class="stat-row" id="adminStats"></div>
    <h3 style="font-size:0.95rem; margin-bottom:10px;">Usuarios</h3>
    <div class="admin-scroll" style="margin-bottom:24px;"><table class="admin-table" id="adminUsersTable"></table></div>
    <h3 style="font-size:0.95rem; margin-bottom:10px;">Todos los lotes</h3>
    <div id="adminListings"></div>
  </section>
</div>

<!-- ================= DETALLE (overlay) ================= -->
<div class="overlay-bg" id="overlayBg" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" id="dialogEl">
    <div class="dialog-head">
      <div class="dialog-media" id="dialogMedia"></div>
      <button class="dialog-close" id="dialogCloseBtn" aria-label="Cerrar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dialog-body">
      <div class="dialog-top">
        <div><h2 id="dialogTitle"></h2><div class="dialog-zone" id="dialogZone"></div></div>
        <div class="dialog-price num" id="dialogPrice"></div>
      </div>
      <p class="dialog-desc" id="dialogDesc"></p>
      <hr class="divider">
      <div class="contact-row" id="dialogContact"></div>
      <div id="dialogActionArea"></div>
    </div>
  </div>
</div>

<!-- ================= AUTH (overlay) ================= -->
<div class="overlay-bg" id="authOverlay" hidden>
  <div class="dialog narrow" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="dialog-body" style="padding-top:22px;">
      <div class="dialog-top" style="margin-bottom:4px;">
        <h2 id="authTitle" style="font-size:1.2rem;">Tu cuenta</h2>
        <button class="dialog-close" id="authCloseBtn" aria-label="Cerrar" style="position:static; background:transparent; color:var(--ink-faint);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="auth-tabs">
        <button data-auth-mode="login" aria-selected="true">Iniciar sesión</button>
        <button data-auth-mode="register" aria-selected="false">Crear cuenta</button>
      </div>
      <form class="auth-form" id="authForm">
        <div class="field full" id="authNameField" hidden><label for="a-name">Tu nombre</label><input type="text" id="a-name" maxlength="60" placeholder="Ej: María González"></div>
        <div class="field full" id="authPhoneField" hidden><label for="a-phone">Teléfono / WhatsApp (opcional)</label><input type="tel" id="a-phone" placeholder="0981 123 456"></div>
        <div class="field full"><label for="a-email">Email</label><input type="email" id="a-email" required placeholder="vos@email.com"></div>
        <div class="field full"><label for="a-password">Contraseña</label><input type="password" id="a-password" required minlength="6" placeholder="Al menos 6 caracteres"></div>
        <div id="authMsg"></div>
        <button type="submit" class="btn btn-primary" id="authSubmitBtn">Iniciar sesión</button>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
